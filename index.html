<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Result History</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet"/>

  <style>
    body {
      background-color: #acecf5;
      font-family: "Quicksand", sans-serif;
      font-weight: bold;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    .card {
      width: 40%;
      min-width: 300px;
      border-radius: 20px;
      background-color: #00a5bb;
      padding: 20px;
    }

    .btn {
      background-color: #04505a;
      color: white;
    }

    #result {
      width: 40%;
      min-width: 300px;
      font-size: 18px;
      font-weight: bold;
      background-color: white;
      border-radius: 15px;
      padding: 20px;
    }

    h2 {
      font-weight: 700;
      color: white;
    }

    @media only screen and (max-width: 767px) {
      .card, #result {
        width: 90%;
        margin: 0 auto;
      }

      #result {
        text-align: center;
      }

      h2 {
        font-size: 24px;
      }

      h5 {
        font-size: 16px;
      }

      .btn {
        width: 100%;
      }
    }

    @media only screen and (min-width: 768px) and (max-width: 1024px) {
      .card, #result {
        width: 60%;
      }

      #result {
        text-align: center;
      }

      h2 {
        font-size: 28px;
      }

      h5 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <div class="card shadow">
      <div class="text-center mb-3">
        <h2>Result Form</h2>
      </div>
      <div class="card-body">
        <form id="searchForm">
          <div class="form-group">
            <label for="enroll"><h5>Enrollment No.</h5></label>
            <input type="text" class="form-control" id="enroll" placeholder="Enter Enrollment No." required />
          </div>
          <div class="form-group">
            <label for="grno"><h5>Gr. No.</h5></label>
            <input type="text" class="form-control" id="grno" placeholder="Enter Gr. No." required />
          </div>
          <button type="submit" class="btn">Search</button>
        </form>
      </div>
    </div>

    <div id="result" class="shadow">
      <h3>Result</h3>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
